name: Feature Request
description: Suggest a new feature or improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: What problem does this feature solve, or what would it improve?
      placeholder: Describe the problem or motivation...
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Idea
      description: How do you envision this working?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or Additional Context
      description: Any alternatives you've considered, or other context.
    validations:
      required: false
